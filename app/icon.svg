<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Ascent mark: dusk sky, the peak, the route, the waypoint diamond. -->
  <rect width="32" height="32" rx="7" fill="#131a29"/>
  <!-- Far ridge -->
  <path d="M2 26 L11 13 L17 20 L20 17 L30 26 Z" fill="#2b3650"/>
  <!-- Main peak with snow cap -->
  <path d="M7 26 L17 8 L27 26 Z" fill="#3d4a63"/>
  <path d="M14.6 12.3 L17 8 L19.4 12.3 L17.8 11.4 L17 12.6 L16 11.5 Z" fill="#dfe6f5"/>
  <!-- The switchback route, climbing to the summit -->
  <path d="M9.5 25 L20 21.5 L13.5 18.5 L18.5 15.5 L16.2 13.2" fill="none" stroke="#f2a541" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Summit waypoint -->
  <path d="M17 2.2 L19.4 4.6 L17 7 L14.6 4.6 Z" fill="#f2a541"/>
</svg>
